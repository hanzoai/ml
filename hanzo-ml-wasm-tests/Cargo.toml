[package]
name = "hanzo-ml-wasm-tests"
# Not published: a test harness, not a library.
publish = false
version = "0.11.8"
edition = "2021"
description = "WASM tests for hanzo"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]

[dependencies]
hanzo-ml = { path = "../hanzo-ml", package = "hanzo-ml", version = "0.11.111" }
rand = "0.9.0"
getrandom = { version = "0.3", features = ["wasm_js"], default-features = false }

[dev-dependencies]
wasm-bindgen-test = "0.3.0"
