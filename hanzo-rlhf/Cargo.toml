# Empty workspace table makes this crate its own root — same pattern as
# hanzo-train and hanzo-quantize. Sidesteps the parent ml workspace's
# pyo3-0.22 vs pyo3-0.27 conflict (candle-pyo3 vs hanzo-ml-pyo3).
[workspace]

[package]
name = "hanzo-rlhf"
version = "0.1.0"
edition = "2021"
authors = ["Hanzo AI <dev@hanzo.ai>"]
description = "RLHF facade for hanzod: typed traits + GRPO/DPO/PPO/KTO/SimPO/ORPO scaffold and the federation-bridged Python trainer endpoint. The native loops are unimplemented today; the bridge is the production path."
license = "Apache-2.0"
repository = "https://github.com/hanzoai/ml"

[dependencies]
# Direct path deps on in-tree candle (mirrors hanzo-train).
candle-core = { path = "../candle-core", version = "0.9.2" }
candle-nn = { path = "../candle-nn", version = "0.9.2" }

anyhow = { version = "1", features = ["backtrace"] }
tracing = "0.1.37"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.99"
thiserror = "2"
# Bridge transport — small surface, only needs JSON + rustls. Not a
# workspace dep because no other ml crate uses HTTP.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "test-util"] }
