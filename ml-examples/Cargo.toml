[package]
name = "ml-examples"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
ml = { workspace = true }
ml-datasets = { workspace = true, optional = true }
ml-nn = { workspace = true }
ml-transformers = { workspace = true }
ml-flash-attn = { workspace = true, optional = true }
ml-onnx = { workspace = true, optional = true }

chrono = "0.4"
csv = "1.3.0"
cudarc = { workspace = true, optional = true }
half = { workspace = true, optional = true }
hf-hub = { workspace = true, features = ["tokio"] }
image = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
num-traits = { workspace = true }
minijinja = { version = "2", features = ["loader"] }
palette = { version = "0.7.6", optional = true }
enterpolation = { version = "0.2.1", optional = true }
pyo3 = { version = "0.27", features = [
    "auto-initialize",
    "abi3-py311",
], optional = true }
rayon = { workspace = true }
rubato = { version = "1", optional = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
symphonia = { version = "0.5.3", features = ["all"], optional = true }
tokenizers = { workspace = true, features = ["onig"] }
cpal = { version = "0.15.2", optional = true }
pdf2image = { version = "0.1.2", optional = true }
tekken-rs = { version = "0.1.1", optional = true }

[dev-dependencies]
anyhow = { workspace = true }
byteorder = { workspace = true }
clap = { workspace = true }
imageproc = { workspace = true }
memmap2 = { workspace = true }
rand = { workspace = true }
ab_glyph = { workspace = true }
tracing = { workspace = true }
tracing-chrome = { workspace = true }
tracing-subscriber = { workspace = true }
# Necessary to disambiguate with tokio in wasm examples which are 1.28.1
tokio = "1.48.0"

[build-dependencies]
anyhow = { workspace = true }
cudaforge = { version = "0.1.2", optional = true }
hf-hub = { workspace = true, features = ["tokio"] }

[features]
default = []
accelerate = [
    "dep:accelerate-src",
    "ml/accelerate",
    "ml-nn/accelerate",
    "ml-transformers/accelerate",
]
cuda = [
    "ml/cuda",
    "ml-nn/cuda",
    "ml-transformers/cuda",
    "dep:cudaforge",
]
cudnn = ["ml/cudnn", "ml-nn/cudnn", "ml-transformers/cudnn"]
flash-attn = ["cuda", "ml-transformers/flash-attn", "dep:ml-flash-attn"]
mkl = [
    "dep:intel-mkl-src",
    "ml/mkl",
    "ml-nn/mkl",
    "ml-transformers/mkl",
]
nccl = ["cuda", "cudarc/nccl", "dep:half"]
onnx = ["ml-onnx"]
metal = ["ml/metal", "ml-nn/metal"]
microphone = ["cpal", "rubato"]
encodec = ["cpal", "symphonia", "rubato"]
mimi = ["cpal", "symphonia", "rubato"]
snac = ["cpal", "symphonia", "rubato"]
depth_anything_v2 = ["palette", "enterpolation"]
tekken = ["tekken-rs"]
buildtime-download = []

[[example]]
name = "llama_multiprocess"
required-features = ["cuda", "nccl", "flash-attn"]

[[example]]
name = "reinforcement-learning"
required-features = ["pyo3"]

[[example]]
name = "onnx"
required-features = ["onnx"]

[[example]]
name = "onnx-llm"
required-features = ["onnx"]

[[example]]
name = "onnx_basics"
required-features = ["onnx"]

[[example]]
name = "whisper"
required-features = ["symphonia"]

[[example]]
name = "whisper-microphone"
required-features = ["microphone"]

[[example]]
name = "mnist-training"
required-features = ["ml-datasets"]

[[example]]
name = "llama2-c"
required-features = ["ml-datasets"]

[[example]]
name = "mimi"
required-features = ["mimi"]

[[example]]
name = "snac"
required-features = ["snac"]

[[example]]
name = "encodec"
required-features = ["encodec"]

[[example]]
name = "depth_anything_v2"
required-features = ["depth_anything_v2"]

[[example]]
name = "silero-vad"
required-features = ["onnx"]

[[example]]
name = "colpali"
required-features = ["pdf2image"]

[[example]]
name = "voxtral"
required-features = ["symphonia"]

[[example]]
name = "bert_single_file_binary"
required-features = ["buildtime-download"]
