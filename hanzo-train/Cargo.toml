[package]
name = "hanzo-train"
# Not published: an application binary, not a library other crates depend on.
publish = false
version.workspace = true
edition.workspace = true
description = "Training on hanzo-ml: one model across heterogeneous machines (DiLoCo local SGD, bf16 deltas, bit-identical resume), and the DSpark draft trainer on it."
repository.workspace = true
keywords = ["training", "distributed", "diloco", "machine-learning"]
categories = ["science"]
license.workspace = true

[[bin]]
name = "hanzo-train"
path = "src/main.rs"

[lib]
name = "hanzo_train"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
hanzo-ml = { workspace = true }
hanzo-nn = { workspace = true }
half = { workspace = true }
libc = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
rand = { workspace = true }
clap = { workspace = true }
