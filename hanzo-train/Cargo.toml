# Empty workspace table marks this crate as its own root. Without it,
# cargo walks up the tree and finds ~/work/hanzo/Cargo.toml or
# ~/work/hanzo/ml/Cargo.toml and tries to splice us in.
[workspace]

[package]
name = "hanzo-train"
version = "0.9.2-alpha.2"
edition = "2021"
description = "LoRA + QLoRA trainer for hanzo-engine architectures (DeepSeek V3, Qwen3 / Qwen3-MoE / Qwen3-Next, GLM-4 / GLM-4-MoE)"
repository = "https://github.com/hanzoai/ml"
keywords = ["lora", "qlora", "peft", "training", "transformer"]
categories = ["science", "algorithms"]
license = "BSD-3-Clause OR Apache-2.0"
readme = "README.md"

# This crate is excluded from the workspace (see ../Cargo.toml) so it
# does not get dragged into the pre-existing pyo3-0.22 vs pyo3-0.27
# conflict between candle-pyo3 and hanzo-ml-pyo3. We pin direct path
# deps to keep the toolchain identical to the rest of the tree.
[dependencies]
# Alias candle-core as `candle` to match the workspace convention so
# `use candle::...` keeps working identically to other in-tree crates.
candle = { path = "../candle-core", package = "candle-core", version = "0.9.2" }
candle-nn = { path = "../candle-nn", version = "0.9.2" }
candle-transformers = { path = "../candle-transformers", version = "0.9.2" }

anyhow = { version = "1", features = ["backtrace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.7"
tracing = "0.1"
rand = "0.9"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
bytes = "1"

[dev-dependencies]
tempfile = "3"
approx = "0.5"

[features]
default = []
cuda = ["candle/cuda", "candle-nn/cuda"]
metal = ["candle/metal", "candle-nn/metal"]

[[example]]
name = "finetune_qwen3"
path = "examples/finetune_qwen3.rs"
