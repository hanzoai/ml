[package]
name = "hanzo-ml-pyo3"
# Not published: a Python extension module; it ships to PyPI via maturin, not to crates.io.
publish = false
version = "0.11.8"
edition = "2021"
description = "Multi-backend tensor & ML framework for Rust — part of the Hanzo ML stack."
repository = "https://github.com/hanzoai/ml"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "hanzo"
crate-type = ["cdylib"]

[dependencies]
accelerate-src = { version = "0.3.2", optional = true }
hanzo-ml = { path = "../hanzo-ml", package = "hanzo-ml", version = "0.11.111" }
hanzo-nn = { path = "../hanzo-nn", version = "0.11.48" }
hanzo-onnx = { path = "../hanzo-onnx", version = "0.11.11", optional = true }
half = { version = "2.5.0", features = ["num-traits", "use-intrinsics", "rand_distr", "zerocopy"] }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"], optional = true }
pyo3 = { version = "0.24.1", features = ["extension-module", "abi3-py38"] }
float8 = { version = "0.7.0", features = ["num-traits", "rand_distr"] }

[build-dependencies]
pyo3-build-config = "0.24.1"

[features]
default = []
accelerate = ["dep:accelerate-src", "hanzo-ml/accelerate"]
cuda = ["hanzo-ml/cuda"]
mkl = ["dep:intel-mkl-src", "hanzo-ml/mkl"]
onnx = ["dep:hanzo-onnx"]


[lints.clippy]
explicit_counter_loop = "allow"
unnecessary_unwrap = "allow"
manual_checked_ops = "allow"
needless_borrow = "allow"
large_const_arrays = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
