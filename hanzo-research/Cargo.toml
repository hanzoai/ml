[package]
name = "hanzo-research"
version = "0.2.4"
edition = "2021"
description = "Record and query R&D evidence from Rust — the /v1/research client of the Hanzo ML stack."
repository = "https://github.com/hanzoai/ml"
keywords = ["benchmark", "provenance", "research", "machine-learning"]
categories = ["science", "api-bindings"]
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0.171", features = ["derive"] }
# float_roundtrip: a JSON number reads back as the double it was written from. The default
# parse misses a 17-digit float by an ulp (333333333.33333329), and a WAL line read so no longer
# hashes to what was chained.
serde_json = { version = "1.0.99", features = ["float_roundtrip"] }
ureq = { version = "2.12", features = ["tls", "gzip"] }
base64 = "0.22"
sha2 = "0.10"
ryu = "1.0.20"
thiserror = "2"
chrono = "0.4"

[lints.clippy]
explicit_counter_loop = "allow"
unnecessary_unwrap = "allow"
manual_checked_ops = "allow"
needless_borrow = "allow"
large_const_arrays = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
