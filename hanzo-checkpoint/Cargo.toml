[package]
name = "hanzo-checkpoint"
version = "0.1.0"
edition = "2021"
authors = ["Hanzo AI Engineers"]
description = "Redundancy-aware checkpointing for Hanzo ML (AdaCheck implementation)"

[dependencies]
hanzo-ml = { path = "../hanzo-ml" }
candle-core = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
rayon = "1.8"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"

[dev-dependencies]
tempfile = "3.8"
