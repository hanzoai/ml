on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

name: Continuous integration

jobs:
  fmt:
    name: Rustfmt
    runs-on: [linux-amd64]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: [linux-amd64]
    steps:
      - uses: actions/checkout@v6
      - name: Install protoc
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            case "$(uname -m)" in
              x86_64) arch=x86_64 ;;
              aarch64) arch=aarch_64 ;;
              *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
            esac
            version=28.3
            curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${version}/protoc-${version}-linux-${arch}.zip" \
              -o "$RUNNER_TEMP/protoc.zip"
            mkdir -p "$HOME/.local"
            unzip -qo "$RUNNER_TEMP/protoc.zip" 'bin/protoc' 'include/*' -d "$HOME/.local"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          protoc --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run workspace clippy and pyo3 onnx check
        run: |
          cargo clippy --workspace --tests --examples --benches -- -D warnings
          cargo clippy -p hanzo-ml-pyo3 --features onnx -- -D warnings
      - name: Record Clippy gate verdict in Hanzo Insights
        if: always()
        env:
          HANZO_API_KEY: ${{ secrets.HANZO_API_KEY }}
          HANZO_INSIGHTS_API_KEY: ${{ secrets.HANZO_INSIGHTS_API_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          verdict="fail"
          [ "$JOB_STATUS" = "success" ] && verdict="pass"
          python3 scripts/ci_security_insights.py \
            --skip-worktree \
            --gate-stage clippy \
            --gate-verdict "$verdict" || true

  test:
    name: Test Suite
    runs-on: [linux-amd64]
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc; do
            [ -e "$d" ] && sudo rm -rf "$d" || true
          done
          df -h
        continue-on-error: true
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            case "$(uname -m)" in
              x86_64) arch=x86_64 ;;
              aarch64) arch=aarch_64 ;;
              *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
            esac
            version=28.3
            curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${version}/protoc-${version}-linux-${arch}.zip" \
              -o "$RUNNER_TEMP/protoc.zip"
            mkdir -p "$HOME/.local"
            unzip -qo "$RUNNER_TEMP/protoc.zip" 'bin/protoc' 'include/*' -d "$HOME/.local"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          protoc --version
      - name: Keep the build between pushes
        run: |
          free_gb() { df -BG --output=avail "$1" 2>/dev/null | tail -1 | tr -dc '0-9'; }
          if [ -d /dev/shm ] && [ "$(free_gb /dev/shm)" -ge 24 ]; then
            dir=/dev/shm/ci-target/${GITHUB_REPOSITORY##*/}
          else
            dir=$HOME/.cache/ci-target/${GITHUB_REPOSITORY##*/}
          fi
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "target: $dir ($(du -sh "$dir" 2>/dev/null | cut -f1) warm)"
      - name: Run tests
        if: runner.os == 'Linux'
        run: |
          if command -v ld.lld >/dev/null; then
            export RUSTFLAGS="-C link-arg=-fuse-ld=lld -C debuginfo=line-tables-only"
          else
            export RUSTFLAGS="-C debuginfo=line-tables-only"
          fi
          cargo test -p hanzo-ml --lib quantized::bitcos
          cargo test -p hanzo-nn -p hanzo-transformers --lib
