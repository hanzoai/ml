name: Publish crates

# Publishes hanzo-* crates to crates.io in dependency order ONLY on strict
# semver tags (vX.Y.Z) and ONLY after the CI gate (Hanzo Security, rustfmt,
# Clippy, unit tests, and commit check-run status verification) passes green.
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  ci-gate:
    name: Release CI Gate
    runs-on: [linux-amd64]
    steps:
      - name: Enforce semver tag format
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            if ! printf '%s\n' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Refusing non-semver release tag '$REF_NAME'; expected vX.Y.Z"
              exit 1
            fi
          fi
          echo "Validated release ref: ${REF_TYPE}:${REF_NAME}"

      - name: Put gate build tree in tmpfs when space permits
        run: |
          rm -rf /dev/shm/hanzo-ml-gate-*
          free_kb=$(df -Pk /dev/shm 2>/dev/null | awk 'NR==2 {print $4}')
          if [ "${free_kb:-0}" -ge $((8 * 1024 * 1024)) ]; then
            echo "CARGO_TARGET_DIR=/dev/shm/hanzo-ml-gate-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Hanzo Security scan + Insights gate telemetry
        env:
          HANZO_API_KEY: ${{ secrets.HANZO_API_KEY }}
          HANZO_INSIGHTS_API_KEY: ${{ secrets.HANZO_INSIGHTS_API_KEY }}
        run: |
          python3 scripts/ci_security_insights.py \
            --git \
            --github-actions \
            --gate-stage release-security

      - name: Provision jq and protoc
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v jq >/dev/null 2>&1; then
            curl -fsSL --retry 3 https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 \
              -o "$HOME/.local/bin/jq"
            chmod +x "$HOME/.local/bin/jq"
          fi
          if ! command -v protoc >/dev/null 2>&1; then
            case "$(uname -m)" in
              x86_64) arch=x86_64 ;;
              aarch64) arch=aarch_64 ;;
              *) echo "::error::no protoc release for $(uname -m)"; exit 1 ;;
            esac
            version=28.3
            curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${version}/protoc-${version}-linux-${arch}.zip" \
              -o "$RUNNER_TEMP/protoc.zip"
            unzip -qo "$RUNNER_TEMP/protoc.zip" 'bin/protoc' 'include/*' -d "$HOME/.local"
          fi
          protoc --version

      - name: Verify commit check-runs and statuses are not failing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          checks_json=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}/repos/${REPO}/commits/${SHA}/check-runs?per_page=100" || echo '{"check_runs":[]}')
          bad_checks=$(printf '%s' "$checks_json" | jq -r '
            [.check_runs[]
              | select(.name != "Release CI Gate" and .name != "publish")
              | select(.status == "completed")
              | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure")
              | "\(.name):\(.conclusion)"] | join(", ")
          ')
          if [ -n "$bad_checks" ]; then
            echo "::error::Refusing to publish commit ${SHA} with failing check-runs: ${bad_checks}"
            exit 1
          fi
          status_json=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}/repos/${REPO}/commits/${SHA}/status" || echo '{"state":"pending","statuses":[]}')
          bad_statuses=$(printf '%s' "$status_json" | jq -r '
            [.statuses[] | select(.state == "failure" or .state == "error") | "\(.context):\(.state)"] | join(", ")
          ')
          if [ -n "$bad_statuses" ]; then
            echo "::error::Refusing to publish commit ${SHA} with failing commit statuses: ${bad_statuses}"
            exit 1
          fi
          echo "Commit ${SHA} has zero failing check-runs or commit statuses."

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run rustfmt, clippy, and core test gates
        run: |
          set -euo pipefail
          if command -v ld.lld >/dev/null 2>&1; then
            export RUSTFLAGS="-C link-arg=-fuse-ld=lld -C debuginfo=line-tables-only"
          else
            export RUSTFLAGS="-C debuginfo=line-tables-only"
          fi
          cargo fmt --all -- --check
          cargo clippy --workspace --tests --examples --benches -- -D warnings
          cargo clippy -p hanzo-ml-pyo3 --features onnx -- -D warnings
          cargo test -p hanzo-ml --lib quantized::bitcos
          cargo test -p hanzo-nn -p hanzo-transformers --lib

      - name: Record release gate verdict in Hanzo Insights
        if: always()
        env:
          HANZO_API_KEY: ${{ secrets.HANZO_API_KEY }}
          HANZO_INSIGHTS_API_KEY: ${{ secrets.HANZO_INSIGHTS_API_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          verdict="fail"
          [ "$JOB_STATUS" = "success" ] && verdict="pass"
          python3 scripts/ci_security_insights.py \
            --skip-worktree \
            --gate-stage release-ci-gate \
            --gate-verdict "$verdict" || true

      - name: Release gate build tree
        if: always()
        run: |
          if [ -n "${CARGO_TARGET_DIR:-}" ]; then rm -rf "$CARGO_TARGET_DIR"; fi

  publish:
    needs: [ci-gate]
    runs-on: [linux-amd64]
    steps:
      - name: Put the build tree in tmpfs when it fits
        run: |
          rm -rf /dev/shm/hanzo-ml-publish-*
          free_kb=$(df -Pk /dev/shm 2>/dev/null | awk 'NR==2 {print $4}')
          if [ "${free_kb:-0}" -ge $((6 * 1024 * 1024)) ]; then
            echo "CARGO_TARGET_DIR=/dev/shm/hanzo-ml-publish-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          else
            echo "::notice::/dev/shm has ${free_kb:-0} KB free; building on the runner disk"
          fi
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Provision jq
        run: |
          set -e
          command -v jq >/dev/null 2>&1 && exit 0
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 \
            -o "$HOME/.local/bin/jq"
          chmod +x "$HOME/.local/bin/jq"

      - name: Provision protoc
        run: |
          set -euo pipefail
          command -v protoc >/dev/null 2>&1 && exit 0
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64) arch=aarch_64 ;;
            *) echo "::error::no protoc release for $(uname -m)"; exit 1 ;;
          esac
          version=28.3
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${version}/protoc-${version}-linux-${arch}.zip" \
            -o "$RUNNER_TEMP/protoc.zip"
          mkdir -p "$HOME/.local"
          unzip -qo "$RUNNER_TEMP/protoc.zip" 'bin/protoc' 'include/*' -d "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/protoc" --version

      - name: cargo check --workspace
        run: |
          set -euo pipefail
          for tool in protoc cc pkg-config; do
            command -v "$tool" >/dev/null || { echo "::error::this runner has no $tool"; exit 1; }
          done
          cargo check --workspace

      - name: Derive the publish order
        id: order
        run: |
          set -euo pipefail
          dirs=$(scripts/publish-order)
          if [ -z "$dirs" ]; then
            echo "::error::scripts/publish-order returned nothing"
            exit 1
          fi
          echo "publishable, dependency-first:"
          echo "$dirs"
          {
            echo "dirs<<PUBLISH_ORDER_EOF"
            echo "$dirs"
            echo "PUBLISH_ORDER_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Is anything ahead of crates.io
        id: ahead
        run: |
          set -euo pipefail
          any=false
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            name=$(grep -m1 '^name = ' "$dir/Cargo.toml" | sed 's/name = "\(.*\)"/\1/')
            new=$(grep -m1 '^version = ' "$dir/Cargo.toml" | sed 's/version = "\(.*\)"/\1/')
            old=$(curl -sf -H 'User-Agent: hanzoai-ci-publish (ops@hanzo.ai)' \
                    "https://crates.io/api/v1/crates/$name" 2>/dev/null \
                    | jq -r '.crate.max_version // "0.0.0"' 2>/dev/null || echo "0.0.0")
            newest=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)
            if [ "$old" != "$new" ] && [ "$newest" = "$new" ]; then
              echo "$name: crates.io has $old, tree has $new (ahead)"
              any=true
            fi
          done <<< "${{ steps.order.outputs.dirs }}"
          echo "yes=$any" >> "$GITHUB_OUTPUT"

      - name: Load the publish credential from KMS
        if: steps.ahead.outputs.yes == 'true'
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          if [ -z "$KMS_CLIENT_ID" ] || [ -z "$KMS_CLIENT_SECRET" ]; then
            echo "::error::KMS machine identity absent; seed KMS_CLIENT_ID and KMS_CLIENT_SECRET." >&2
            exit 1
          fi
          KMS=https://kms.hanzo.ai; ENVN=prod
          TOKEN=$(curl -sf "$KMS/v1/kms/auth/login" -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}" | jq -r .accessToken)
          [ -n "$TOKEN" ] && [ "$TOKEN" != null ] || { echo "::error::KMS login failed"; exit 1; }
          URL="$KMS/v1/kms/secrets/CARGO_REGISTRY_TOKEN?env=$ENVN"
          BODY=$(curl -s -w '\n%{http_code}' "$URL" -H "Authorization: Bearer $TOKEN") || true
          CODE=$(printf '%s' "$BODY" | tail -1)
          VAL=$(printf '%s' "$BODY" | sed '$d' | jq -r '.value // empty' 2>/dev/null || true)
          if [ -z "$VAL" ]; then
            echo "::error::KMS returned HTTP $CODE for $URL with no value." >&2
            exit 1
          fi
          echo "::add-mask::$VAL"
          echo "CARGO_REGISTRY_TOKEN=$VAL" >> "$GITHUB_ENV"

      - name: Publish the crates ahead of crates.io (dependency order)
        if: steps.ahead.outputs.yes == 'true'
        run: |
          set +e
          fail=0
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "::group::publish $dir"
            out=$( cd "$dir" && cargo publish --no-verify 2>&1 ); rc=$?
            echo "$out"
            if [ "$rc" -ne 0 ]; then
              if echo "$out" | grep -qiE 'already (uploaded|exists)|is already uploaded'; then
                echo "::warning::$dir already at this version; skipping"
              else
                echo "::error::$dir publish FAILED"; fail=1
              fi
            fi
            echo "::endgroup::"
          done <<< "${{ steps.order.outputs.dirs }}"
          exit "$fail"

      - name: Release the build tree
        if: always()
        run: |
          if [ -n "${CARGO_TARGET_DIR:-}" ]; then rm -rf "$CARGO_TARGET_DIR"; fi
