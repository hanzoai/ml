# Canonical caller; every knob lives in /hanzo.yml, none here.
# Runs on the git-runner fleet at git.hanzo.ai, the pool serving these labels.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
