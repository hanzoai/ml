on:
  push:

name: Secret Leaks

# The runner has no Docker socket, so the scanner runs as its release binary rather than the
# container action. A push scans the commits it brought; a branch's first push scans its history.
jobs:
  trufflehog:
    runs-on: linux-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Secret Scanning
        env:
          VERSION: "3.97.5"
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/v${VERSION}/trufflehog_${VERSION}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" trufflehog
          since=(); [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && since=(--since-commit "$BEFORE")
          "$RUNNER_TEMP/trufflehog" git "file://$PWD" "${since[@]}" --branch "$AFTER" --results=verified,unknown --fail --no-update --github-actions
