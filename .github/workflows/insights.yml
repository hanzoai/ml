name: Hanzo Insights

# Replaces legacy trufflehog.yml with native Hanzo Security + Hanzo Insights
# commit-history and working-tree secret scanning on self-hosted linux-amd64.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security & Insights Gate
    runs-on: [linux-amd64]
    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Hanzo Security scan and emit Hanzo Insights telemetry
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          HANZO_API_KEY: ${{ secrets.HANZO_API_KEY }}
          HANZO_INSIGHTS_API_KEY: ${{ secrets.HANZO_INSIGHTS_API_KEY }}
        run: |
          python3 scripts/ci_security_insights.py \
            --git \
            --since-commit "${BEFORE}" \
            --branch "${AFTER}" \
            --github-actions \
            --gate-stage insights-security
