[package]
name = "hanzo-nn"
version = "0.11.40"
edition = "2021"
description = "Multi-backend tensor & ML framework for Rust — part of the Hanzo ML stack."
repository = "https://github.com/hanzoai/ml"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
hanzo-ml = { workspace = true }
hanzo-metal-kernels = { workspace = true, optional = true }
hanzo-kernels = { workspace = true, optional = true, features = ["cutile"] }
half = { workspace = true }
thiserror = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
num-traits = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
objc2-metal = { workspace = true, optional = true }
libc = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
criterion = { workspace = true }

[features]
default = []
accelerate = ["dep:accelerate-src", "hanzo-ml/accelerate"]
cuda = ["hanzo-ml/cuda"]
rocm = ["hanzo-ml/rocm"]
vulkan = ["hanzo-ml/vulkan"]
cutile = ["cuda", "hanzo-ml/cutile", "dep:hanzo-kernels"]
cudnn = ["hanzo-ml/cudnn"]
mkl = ["dep:intel-mkl-src", "hanzo-ml/mkl"]
metal = ["hanzo-ml/metal", "dep:hanzo-metal-kernels", "dep:objc2-metal"]
metal-debug-labels = ["metal", "hanzo-ml/metal-debug-labels"]

[[bench]]
name = "bench_main"
harness = false

[lints]
workspace = true
