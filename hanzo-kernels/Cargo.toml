# Excluded from the repo workspace, so it is its own root: without this cargo walks up
# past the repo and adopts whatever workspace sits above it.
[workspace]

[package]
name = "hanzo-kernels"
version = "0.11.37"
edition = "2021"
description = "Multi-backend tensor & ML framework for Rust — part of the Hanzo ML stack."
repository = "https://github.com/hanzoai/ml"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"

[dependencies]

[features]
cutile = []

[build-dependencies]
bindgen_cuda = { package = "hanzo-bindgen-cuda", version = "0.1.8" }
glob = "0.3"
