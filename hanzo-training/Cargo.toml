[package]
name = "hanzo-training"
version = "0.11.11"
edition = "2021"
description = "Training framework for Hanzo ML models on zen-agentic-dataset"
repository = "https://github.com/hanzoai/ml"
keywords = ["machine-learning", "training", "transformer", "llm"]
categories = ["science", "algorithms"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
hanzo-ml = { path = "../hanzo-ml", package = "hanzo-ml", version = "0.11.111" }
hanzo-nn = { path = "../hanzo-nn", version = "0.11.48" }
hanzo-transformers = { path = "../hanzo-transformers", version = "0.11.16" }
hanzo-datasets = { path = "../hanzo-datasets", version = "0.11.10" }

# Core dependencies
anyhow = { version = "1", features = ["backtrace"] }
clap = { version = "4.2.4", features = ["derive"] }
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.99"
log = "0.4"
thiserror = "2"
tokio = { version = "1.0", features = ["full"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Configuration
chrono = "0.4"
serde_yaml = "0.9"
toml = "0.8"

# Training specific
rand = "0.9.0"
rayon = "1.7.0"
safetensors = "0.8.0"

# Progress and metrics
indicatif = "0.18"
# wandb = { version = "0.1", optional = true }  # Commented out for now

[dev-dependencies]
tempfile = "3.0"

[features]
default = []
cuda = ["hanzo-ml/cuda", "hanzo-nn/cuda"]
metal = ["hanzo-ml/metal", "hanzo-nn/metal"]
# wandb = ["dep:wandb"]  # Commented out for now

# The binary is named for its crate, not for a verb it cannot perform. `hanzo-train`
# is the `hanzo-train` crate's binary — the DSpark draft trainer that reaches
# hanzo_nn::AdamW and writes an engine-loadable checkpoint. Two `[[bin]]` targets
# with one name both uplift to `target/<profile>/hanzo-train`, so whichever linked
# last decided whether `cargo build --workspace` left you a trainer or a CLI whose
# `train` subcommand refuses (see src/model.rs::unwired). One name, one artifact.
#
# What this binary can do is READ and WRITE a training config (`validate`,
# `template`); `train` refuses until the config-driven path is wired to
# hanzo-transformers. The connected training path in this crate is `grpo`.
[[bin]]
name = "hanzo-training"
path = "src/bin/train.rs"

[[bin]]
name = "hanzo-eval"
path = "src/bin/eval.rs"

[[example]]
name = "train_llama"
path = "examples/train_llama.rs"

[[example]]
name = "train_qwen"
path = "examples/train_qwen.rs"

[[example]]
name = "grpo_toy"
path = "examples/grpo_toy.rs"