[package]
name = "face-detect-run"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "face-detect-run"
path = "main.rs"

[dependencies]
hanzo-ml = { path = "../../../hanzo-ml" }
hanzo-nn = { path = "../../../hanzo-nn" }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[features]
cuda = ["hanzo-ml/cuda", "hanzo-nn/cuda"]
cudnn = ["hanzo-ml/cudnn", "hanzo-nn/cudnn"]

[workspace]
