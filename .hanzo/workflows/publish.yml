name: Publish crates

# The one publish workflow. It runs only on the native forge -- the fork scans
# .hanzo/workflows first and GitHub.com ignores .hanzo/ entirely -- on the mapped
# `hanzo-build-linux-amd64` label.
#
# Publishes the hanzo-* crates to crates.io in dependency order on a version tag
# (e.g. `0.11.4`). GPU build scripts can't run on crates.io builders, so we publish
# with --no-verify (downstream consumers build against their own SDK).
# Requires repo secret CARGO_REGISTRY_TOKEN (a crates.io API token, from KMS).
#
# Each crate carries its own version, so the tag names the release event and the
# manifests name the artifacts. Re-running a tag is safe: a crate already on the
# registry at its manifest version reports "already uploaded" and is skipped, so
# this publishes exactly the crates whose version moved since the last run.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch: {}

jobs:
  publish:
    # `cargo publish --no-verify` is a pure upload (no GPU build). Seed the
    # crates.io token as a repo/org secret CARGO_REGISTRY_TOKEN (from KMS).
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish hanzo-* crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -u
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is empty -- set it (from KMS) as a repo/org secret"; exit 1
          fi
          # GHA runs `run:` under `bash -e`; disable errexit so `out=$(cargo publish ...); rc=$?` can
          # CAPTURE a non-zero rc and let the already-uploaded->skip logic run. Without this, the first
          # already-published crate (e.g. hanzo-kernels) aborts the whole loop before reaching hanzo-ml.
          set +e
          # This list used to be written out by hand, and hanzo-kernel (singular, the kernel DSL)
          # was missing from it -- only hanzo-kernels (plural, the CUDA kernels) was there. A crate
          # absent from this loop never reaches the registry, so it drifted to 0.2.20 on crates.io
          # against 0.2.39 in tree before anyone noticed. scripts/publish-order derives both the set
          # and the order from the manifests: a crate is published because it exists, and
          # `publish = false` is the one way to opt out.
          #
          # Derive the order in its own step and REQUIRE it to be non-empty. Inlined as
          # `for c in $(scripts/publish-order)` a failing script yields an empty word list, the
          # loop body never runs, and the job goes green having published nothing -- the silent
          # no-op is worse than the drift it replaced.
          order=$( scripts/publish-order ); rc=$?
          if [ "$rc" -ne 0 ] || [ -z "$order" ]; then
            echo "::error::could not derive the publish order (scripts/publish-order rc=$rc)"; exit 1
          fi
          echo "publishing $(echo "$order" | wc -l) crates in dependency order:"; echo "$order"
          fail=0
          for c in $order; do
            echo "::group::publish $c"
            out=$( cd "$c" && cargo publish --no-verify 2>&1 ); rc=$?
            echo "$out"
            if [ "$rc" -ne 0 ]; then
              if echo "$out" | grep -qiE 'already (uploaded|exists)|is already uploaded'; then
                echo "::warning::$c already at this version -- skipping"
              else
                echo "::error::$c publish FAILED"; fail=1
              fi
            fi
            echo "::endgroup::"
          done
          exit "$fail"
