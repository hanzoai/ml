[package]
name = "hanzo-ml-wasm-example-yolo"
# Not published: browser demo programs, built and tested in-tree only.
publish = false
version = "0.11.8"
edition = "2021"
description = "Multi-backend tensor & ML framework for Rust — part of the Hanzo ML stack."
repository = "https://github.com/hanzoai/ml"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"

[dependencies]
hanzo-ml = { path = "../../hanzo-ml", package = "hanzo-ml", version = "0.11.111" }
hanzo-nn = { path = "../../hanzo-nn", version = "0.11.48" }
num-traits = "0.2.15"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.99"
image = { version = "0.25.2", default-features = false, features = ["jpeg", "png"] }

# App crates.
anyhow = { version = "1", features = ["backtrace"] }
byteorder = "1.4.3"
log = "0.4"
rand = "0.9.0"
safetensors = "0.8.0"

# Wasm specific crates.
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }
gloo = "0.12"
js-sys = "0.3.64"
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "0.4.37"
wasm-logger = "0.2"
yew-agent = "0.5.0"
yew = { version = "0.23.0", features = ["csr"] }

[dependencies.web-sys]
version = "=0.3.104"
features = [
  'Blob',
  'CanvasRenderingContext2d',
  'Document',
  'Element',
  'HtmlElement',
  'HtmlCanvasElement',
  'HtmlImageElement',
  'ImageData',
  'Node',
  'Window',
  'Request',
  'RequestCache',
  'RequestInit',
  'RequestMode',
  'Response',
  'Performance',
  'TextMetrics',
]
