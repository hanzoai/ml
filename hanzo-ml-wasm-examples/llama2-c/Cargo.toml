[package]
name = "hanzo-ml-wasm-example-llama2"
# Not published: browser demo programs, built and tested in-tree only.
publish = false
version = "0.11.8"
edition = "2021"
description = "Multi-backend tensor & ML framework for Rust — part of the Hanzo ML stack."
repository = "https://github.com/hanzoai/ml"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"

[dependencies]
hanzo-ml = { path = "../../hanzo-ml", package = "hanzo-ml", version = "0.11.111" }
hanzo-nn = { path = "../../hanzo-nn", version = "0.11.48" }
hanzo-transformers = { path = "../../hanzo-transformers", version = "0.11.16" }
num-traits = "0.2.15"
tokenizers = { version = "0.23.1", default-features = false, features = ["unstable_wasm"] }

# App crates.
anyhow = { version = "1", features = ["backtrace"] }
byteorder = "1.4.3"
log = "0.4"
rand = "0.9.0"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.99"

# Wasm specific crates.
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }
gloo = "0.12"
js-sys = "0.3.64"
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "0.4.37"
wasm-logger = "0.2"
yew-agent = "0.5.0"
yew = { version = "0.23.0", features = ["csr"] }

[dependencies.web-sys]
version = "0.3.70"
features = [
  'Blob',
  'Document',
  'Element',
  'HtmlElement',
  'Node',
  'Window',
  'Request',
  'RequestCache',
  'RequestInit',
  'RequestMode',
  'Response',
  'Performance',
]
