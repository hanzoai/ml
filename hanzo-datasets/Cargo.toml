[package]
name = "hanzo-datasets"
version = "0.11.9"
edition = "2021"
description = "MNIST, Fashion-MNIST, CIFAR-10 and TinyStories loaders and a batcher for hanzo-ml."
repository = "https://github.com/hanzoai/ml"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
byteorder = { workspace = true }
hanzo-ml = { workspace = true }
hanzo-nn = { workspace = true }
hf-hub = { workspace = true}
intel-mkl-src = { workspace = true, optional = true }
memmap2 = { workspace = true }
tokenizers = { workspace = true, features = ["fancy-regex"] }
rand = { workspace = true }
thiserror = { workspace = true }
parquet = { workspace = true}
image = { workspace = true }

[lints]
workspace = true
