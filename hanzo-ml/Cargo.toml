[package]
name = "hanzo-ml"
version = "0.11.113"
edition = "2021"
description = "Fast multi-backend tensor & ML framework for Rust (CPU/CUDA/Metal/Vulkan/ROCm) with quantization — the compute core of the Hanzo stack."
repository = "https://github.com/hanzoai/ml"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "BSD-3-Clause OR Apache-2.0"
readme = "README.md"

[dependencies]
accelerate-src = { version = "0.3.2", optional = true }
byteorder = "1.4.3"
hanzo-kernels = { path = "../hanzo-kernels", version = "0.11.40", optional = true }
hanzo-metal-kernels = { path = "../hanzo-metal-kernels", version = "0.11.47", optional = true }
objc2-metal = { version = "0.3.1", optional = true }
objc2-foundation = { version = "0.3.1", optional = true }
cudarc = { version = "0.19.8", features = ["std", "cublas", "cublaslt", "curand", "driver", "nvrtc", "f16", "f8", "cuda-version-from-build-system", "dynamic-linking"], default-features = false, optional = true }
rocm-rs = { package = "hanzo-rocm", version = "0.5.2", default-features = false, features = ["macros"], optional = true }
hanzo-rocm-kernels = { path = "../hanzo-rocm-kernels", version = "0.11.43", optional = true }
ash = { version = "0.38", optional = true }
wgpu = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }
cutile = { version = "=0.3.1", optional = true }
gemm = { version = "0.19.0", features = ["wasm-simd128-enable"] }
half = { version = "2.5.0", features = ["num-traits", "use-intrinsics", "rand_distr", "zerocopy"] }
float8 = { version = "0.7.0", features = ["num-traits", "rand_distr"] }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"], optional = true }
libc = "0.2.147"
libm = "0.2.15"
memmap2 = { version = "0.9.3", features = ["stable_deref_trait"] }
num-traits = "0.2.15"
num_cpus = "1.15.0"
rand = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.7.0"
safetensors = "0.8.0"
thiserror = "2"
yoke = { version = "0.8.1", features = ["derive"] }
zerocopy = "0.8"
zip = { version = "8.6.0", default-features = false }
parking_lot = "0.12.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
anyhow = { version = "1", features = ["backtrace"] }
clap = { version = "4.2.4", features = ["derive"] }
criterion = { version = "0.8", default-features = false }
# Evolutionary autotuner (Space / Evolution / Evaluator). Test-only; `default-features = false` keeps
# cubecl's runtime backends out of the ml test build -- only the schedule-search algebra is used.
hanzo-kernel = { path = "../hanzo-kernel", default-features = false }

[features]
default = []
cuda = ["cudarc", "dep:hanzo-kernels"]
cutile = ["cuda", "dep:cutile"]
cudnn = ["cuda", "cudarc/cudnn"]
nccl = ["cuda", "cudarc/nccl"]
rocm = ["dep:rocm-rs", "dep:hanzo-rocm-kernels"]
# MIOpen-backed conv ops (conv1d/conv2d/conv_transpose1d). Off by default: MIOpen
# ships in the Linux ROCm SDK but NOT the Windows ROCm 7.x SDK. Enable on a ROCm
# install that includes MIOpen to get GPU conv; LLM inference does not need it.
rocm-miopen = ["rocm-rs/miopen"]
vulkan = ["dep:ash"]
wgpu = ["dep:wgpu", "dep:pollster"]
mkl = ["dep:intel-mkl-src"]
accelerate = ["dep:accelerate-src"]
metal = [
    "dep:hanzo-metal-kernels",
    "dep:objc2-metal",
    "dep:objc2-foundation",
]
metal-debug-labels = ["metal", "hanzo-metal-kernels/debug-labels"]

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "metal_basics"
required-features = ["metal"]

[[example]]
name = "cuda_basics"
required-features = ["cuda"]

[[example]]
name = "cutile"
required-features = ["cutile"]

[lints.clippy]
explicit_counter_loop = "allow"
unnecessary_unwrap = "allow"
manual_checked_ops = "allow"
needless_borrow = "allow"
large_const_arrays = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
